# Gerado por scripts/gerar_fontes.py — NÃO editar à mão; altere o gerador e rode de novo.
# Formato: Power Apps Source Code (*.pa.yaml), schema v3.0.
Screens:
  scrCarteira:
    Properties:
      Fill: =nfCorFundo
    Children:
    - cabFundo_Carteira:
        Control: Rectangle
        Properties:
          X: =0
          Y: =0
          Width: =Parent.Width
          Height: =56
          Fill: =nfCorNavy
    - cabMarca_Carteira:
        Control: Label
        Properties:
          Text: ="DIL · Diligenciamento SAP"
          X: =20
          Y: =0
          Width: =300
          Height: =56
          Size: =14
          Color: =nfCorCartao
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabUsuario_Carteira:
        Control: Label
        Properties:
          Text: =User().FullName & "  ·  " & gblPerfil
          X: =Parent.Width - 560
          Y: =0
          Width: =360
          Height: =56
          Size: =10
          Color: =nfCorCartao
          Font: =Font.'Segoe UI'
          Align: =Align.Right
    - cabAtualizar_Carteira:
        Control: Classic/Button
        Properties:
          Text: ="Atualizar dados"
          X: =Parent.Width - 180
          Y: =12
          Width: =160
          Height: =32
          OnSelect: |-
            =Concurrent(
                ClearCollect(colVinc, Filter(DIL_Vinculo_RC_PO, Ativo = true)),
                ClearCollect(colItensPO, Filter(DIL_Itens_Pedido, Ativo = true)),
                ClearCollect(colOcor, Filter(DIL_Ocorrencias, Ativo = true)),
                ClearCollect(colAcoes, Filter(DIL_Acoes, Ativo = true)),
                ClearCollect(colMarcos, DIL_Marcos),
                ClearCollect(colComun, DIL_Comunicacoes),
                ClearCollect(colComp, Filter(DIL_Compromissos, Ativo = true)),
                ClearCollect(colReq, Filter(DIL_Requisicoes, Ativa = true)),
                ClearCollect(colItensRC, Filter(DIL_Itens_Requisicao, Ativo = true)),
                ClearCollect(colForn, Filter(DIL_Fornecedores, Ativo = true)),
                ClearCollect(colEnvios, Filter(DIL_Historico, Tipo_Evento.Value = "Envio_Email"))
            );
            ClearCollect(
                colCarteira,
                AddColumns(
                    AddColumns(
                        colVinc As v,
                        ItemPO, LookUp(colItensPO, Numero_PO = v.Numero_PO && Item_PO = v.Item_PO),
                        RC, LookUp(colReq, Numero_RC = v.Numero_RC),
                        ItemRC, LookUp(colItensRC, Numero_RC = v.Numero_RC && Item_RC = v.Item_RC),
                        Forn, LookUp(colForn, Codigo_Fornecedor = LookUp(colItensPO, Numero_PO = v.Numero_PO && Item_PO = v.Item_PO, Codigo_Fornecedor)),
                        QtdOcorrAbertas, CountRows(Filter(colOcor, Numero_PO = v.Numero_PO && Item_PO = v.Item_PO && !(Status_Ocorrencia.Value in nfOcorFechadas))),
                        QtdCriticas, CountRows(Filter(colOcor, Numero_PO = v.Numero_PO && Item_PO = v.Item_PO && Severidade.Value = "Crítica" && !(Status_Ocorrencia.Value in nfOcorFechadas))),
                        QtdAcoesPend, CountRows(Filter(colAcoes, Numero_PO = v.Numero_PO && Item_PO = v.Item_PO && !(Status_Acao.Value in nfAcaoFechadas))),
                        QtdMarcosAtrasados, CountRows(Filter(colMarcos, Numero_PO = v.Numero_PO && Item_PO = v.Item_PO && IsBlank(Data_Realizada) && Data_Planejada < Today() && !(Status_Marco.Value in nfMarcoFechados)))
                    ) As c,
                    Situacao, If(c.QtdCriticas > 0, "Crítico", c.QtdOcorrAbertas > 0 || c.QtdMarcosAtrasados > 0, "Em risco", "Normal")
                )
            );
            Set(gblCarregadoEm, Now());
            Notify("Dados atualizados.", NotificationType.Success)
          Fill: =nfCorCartao
          Color: =nfCorAzul
          HoverFill: =nfCorFundo
          BorderColor: =nfCorAzul
          BorderThickness: =1
          Size: =10
          RadiusTopLeft: =4
          RadiusTopRight: =4
          RadiusBottomLeft: =4
          RadiusBottomRight: =4
    - menuFundo_Carteira:
        Control: Rectangle
        Properties:
          X: =0
          Y: =56
          Width: =220
          Height: =Parent.Height - 56
          Fill: =nfCorNavy
    - galMenu_Carteira:
        Control: Gallery
        Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
        Properties:
          Items: =Filter(nfMenu, Perfis = "*" || gblPerfil in Split(Perfis, ","))
          X: =0
          Y: =68
          Width: =220
          Height: =Parent.Height - 116
          TemplateSize: =44
          TemplatePadding: =0
          ShowScrollbar: =false
          OnSelect: =Switch(ThisItem.Chave, "inicio", Navigate(scrInicio, ScreenTransition.None), "carteira", Navigate(scrCarteira, ScreenTransition.None), "dossie", Navigate(scrDossie, ScreenTransition.None), "ocorrencias", Navigate(scrOcorrencias, ScreenTransition.None), "acoes", Navigate(scrAcoes, ScreenTransition.None), "agenda", Navigate(scrAgenda, ScreenTransition.None), "comunicacoes", Navigate(scrComunicacoes, ScreenTransition.None), "gestao", Navigate(scrGestao, ScreenTransition.None), "admin", Navigate(scrAdmin, ScreenTransition.None))
        Children:
        - mnuSel_Carteira:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =Parent.TemplateHeight - 4
              Fill: =If(ThisItem.Chave = "carteira", nfCorNavy2, nfCorNavy)
              OnSelect: =Select(Parent)
        - mnuRotulo_Carteira:
            Control: Label
            Properties:
              Text: =ThisItem.Rotulo
              X: =16
              Y: =0
              Width: =Parent.TemplateWidth - 24
              Height: =Parent.TemplateHeight - 4
              Size: =11
              Color: =nfCorCartao
              Font: =Font.'Segoe UI'
              OnSelect: =Select(Parent)
              FontWeight: =If(ThisItem.Chave = "carteira", FontWeight.Semibold, FontWeight.Normal)
    - menuRodape_Carteira:
        Control: Label
        Properties:
          Text: ="Atualizado " & If(IsBlank(gblCarregadoEm), "—", Text(gblCarregadoEm, "dd/mm hh:mm"))
          X: =16
          Y: =Parent.Height - 40
          Width: =196
          Height: =28
          Size: =9
          Color: =nfCorLinha
          Font: =Font.'Segoe UI'
    - lblTitulo_Carteira:
        Control: Label
        Properties:
          Text: ="Minha carteira"
          X: =240
          Y: =70
          Width: =Parent.Width - 260
          Height: =40
          Size: =20
          Color: =nfCorTexto
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - txtBusca_Carteira:
        Control: Classic/TextInput
        Properties:
          Default: =""
          HintText: ="Buscar RC, PO, material, descrição ou fornecedor"
          X: =240
          Y: =120
          Width: =360
          Height: =36
          Size: =10
          BorderColor: =nfCorLinha
    - ddSituacao_Carteira:
        Control: Classic/DropDown
        Properties:
          Items: =["(Todos)", "Crítico", "Em risco", "Normal"]
          X: =612
          Y: =120
          Width: =150
          Height: =36
          Size: =10
          BorderColor: =nfCorLinha
    - ddFornecedor_Carteira:
        Control: Classic/DropDown
        Properties:
          Items: '=Ungroup(Table({o: ["(Todos)"]}, {o: Sort(Distinct(colCarteira, ItemPO.Nome_Fornecedor), Value)}), o)'
          X: =774
          Y: =120
          Width: =260
          Height: =36
          Size: =10
          BorderColor: =nfCorLinha
    - ddEscopo_Carteira:
        Control: Classic/DropDown
        Properties:
          Items: =["Minha carteira (responsável pela RC)", "Com ações sob minha responsabilidade", "Todos os itens"]
          X: =1046
          Y: =120
          Width: =300
          Height: =36
          Size: =10
          BorderColor: =nfCorLinha
          Default: =If(CountRows(Filter(colCarteira, Lower(RC.Responsavel_Diligencia.Email) = nfEmailUsuario)) > 0, "Minha carteira (responsável pela RC)", "Todos os itens")
    - cabCarteira0:
        Control: Label
        Properties:
          Text: ="RC / item · responsável"
          X: =240 + 16
          Y: =168
          Width: =130
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabCarteira1:
        Control: Label
        Properties:
          Text: ="PO / item"
          X: =240 + 150
          Y: =168
          Width: =130
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabCarteira2:
        Control: Label
        Properties:
          Text: ="Material · descrição"
          X: =240 + 284
          Y: =168
          Width: =330
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabCarteira3:
        Control: Label
        Properties:
          Text: ="Fornecedor"
          X: =240 + 620
          Y: =168
          Width: =240
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabCarteira4:
        Control: Label
        Properties:
          Text: ="1ª remessa"
          X: =240 + 864
          Y: =168
          Width: =90
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabCarteira5:
        Control: Label
        Properties:
          Text: ="Pendências"
          X: =240 + 958
          Y: =168
          Width: =170
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - cabCarteira6:
        Control: Label
        Properties:
          Text: ="Situação · prioridade"
          X: =240 + 1132
          Y: =168
          Width: =100
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
          FontWeight: =FontWeight.Semibold
    - galCarteira_Carteira:
        Control: Gallery
        Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
        Properties:
          Items: |-
            =Filter(
                colCarteira As c,
                IsBlank(txtBusca_Carteira.Text) || txtBusca_Carteira.Text in c.Numero_RC || txtBusca_Carteira.Text in c.Numero_PO
                    || txtBusca_Carteira.Text in c.ItemPO.Material || txtBusca_Carteira.Text in c.ItemPO.Descricao_Produto
                    || txtBusca_Carteira.Text in c.ItemPO.Nome_Fornecedor || txtBusca_Carteira.Text in c.RC.Responsavel_Diligencia.DisplayName,
                ddSituacao_Carteira.Selected.Value = "(Todos)" || c.Situacao = ddSituacao_Carteira.Selected.Value,
                ddFornecedor_Carteira.Selected.Value = "(Todos)" || c.ItemPO.Nome_Fornecedor = ddFornecedor_Carteira.Selected.Value,
                Switch(
                    ddEscopo_Carteira.Selected.Value,
                    "Todos os itens", true,
                    "Minha carteira (responsável pela RC)", Lower(c.RC.Responsavel_Diligencia.Email) = nfEmailUsuario,
                    CountRows(Filter(colAcoes, Numero_PO = c.Numero_PO && Item_PO = c.Item_PO && Lower(Responsavel_Pessoa.Email) = nfEmailUsuario)) > 0
                )
            )
          X: =240
          Y: =198
          Width: =Parent.Width - 260
          Height: =Parent.Height - 242
          TemplateSize: =52
          TemplatePadding: =0
          ShowScrollbar: =true
          OnSelect: =Set(gblItem, ThisItem); Navigate(scrDossie, ScreenTransition.None)
        Children:
        - cFundo_Carteira:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =Parent.TemplateHeight - 1
              Fill: =nfCorCartao
              OnSelect: =Select(Parent)
        - cFaixa_Carteira:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =4
              Height: =Parent.TemplateHeight - 1
              Fill: =Switch(ThisItem.Situacao, "Crítico", nfCorVermelho, "Em risco", nfCorLaranja, nfCorVerde)
        - cRC_Carteira:
            Control: Label
            Properties:
              Text: =ThisItem.Numero_RC & " / " & ThisItem.Item_RC & Char(10) & Coalesce(ThisItem.RC.Responsavel_Diligencia.DisplayName, "sem responsável")
              X: =16
              Y: =0
              Width: =130
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
        - cPO_Carteira:
            Control: Label
            Properties:
              Text: =ThisItem.Numero_PO & " / " & ThisItem.Item_PO
              X: =150
              Y: =0
              Width: =130
              Height: =Parent.TemplateHeight
              Size: =10
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
        - cDesc_Carteira:
            Control: Label
            Properties:
              Text: =Coalesce(ThisItem.ItemPO.Material, "—") & " · " & Coalesce(ThisItem.ItemPO.Descricao_Produto, "—")
              X: =284
              Y: =0
              Width: =330
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
        - cForn_Carteira:
            Control: Label
            Properties:
              Text: =Coalesce(ThisItem.ItemPO.Nome_Fornecedor, "—")
              X: =620
              Y: =0
              Width: =240
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
        - cRem_Carteira:
            Control: Label
            Properties:
              Text: =If(IsBlank(ThisItem.ItemPO.Data_1_Remessa_Item_SAP), "—", Text(ThisItem.ItemPO.Data_1_Remessa_Item_SAP, "dd/mm/yyyy"))
              X: =864
              Y: =0
              Width: =90
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
        - cPend_Carteira:
            Control: Label
            Properties:
              Text: =ThisItem.QtdOcorrAbertas & " ocorr. · " & ThisItem.QtdAcoesPend & " ações · " & ThisItem.QtdMarcosAtrasados & " marcos atras."
              X: =958
              Y: =0
              Width: =170
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorSuave
              Font: =Font.'Segoe UI'
        - cSit_Carteira:
            Control: Label
            Properties:
              Text: =ThisItem.Situacao & Char(10) & Coalesce(ThisItem.RC.Prioridade.Value, "—")
              X: =1132
              Y: =0
              Width: =100
              Height: =Parent.TemplateHeight
              Size: =10
              Color: =Switch(ThisItem.Situacao, "Crítico", nfCorVermelho, "Em risco", nfCorLaranja, nfCorVerde)
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
    - lblTotal_Carteira:
        Control: Label
        Properties:
          Text: =CountRows(galCarteira_Carteira.AllItems) & " de " & CountRows(colCarteira) & " itens (RC/PO vinculados e ativos)"
          X: =240
          Y: =Parent.Height - 40
          Width: =Parent.Width - 260
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
