            Properties:
              Text: =Coalesce(ThisItem.ItemPO.Material, "—") & " · " & Coalesce(ThisItem.ItemPO.Descricao_Produto, "—")
              X: =254
              Y: =0
              Width: =270
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
        - cForn_Carteira:
            Control: Label@2.5.1
            Properties:
              Text: =Coalesce(ThisItem.ItemPO.Nome_Fornecedor, "—")
              X: =528
              Y: =0
              Width: =170
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
        - cDatas_Carteira:
            Control: Label@2.5.1
            Properties:
              Text: =If(IsBlank(ThisItem.DataSAP), "—", Text(ThisItem.DataSAP, "dd/mm/yyyy")) & Char(10) & "→ " & If(IsBlank(ThisItem.DataNegociada), "—", Text(ThisItem.DataNegociada, "dd/mm/yyyy"))
              X: =702
              Y: =0
              Width: =150
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
        - cGanho_Carteira:
            Control: Label@2.5.1
            Properties:
              Text: =If(IsBlank(ThisItem.GanhoDias), "—", If(ThisItem.GanhoDias > 0, "+", "") & ThisItem.GanhoDias & " d") & Char(10) & If(ThisItem.DiasSemContato = 999, "sem contato", "há " & ThisItem.DiasSemContato & " d")
              X: =856
              Y: =0
              Width: =120
              Height: =Parent.TemplateHeight
              Size: =9
              Color: =If(Coalesce(ThisItem.GanhoDias, 0) > 0, nfCorVerde, nfCorTexto)
              Font: =Font.'Segoe UI'
        - cSit_Carteira:
            Control: Label@2.5.1
            Properties:
              Text: =ThisItem.Situacao & If(ThisItem.Parcial, " · parcial", "") & If(ThisItem.ProblemaNF <> "", " · NF", "") & Char(10) & Coalesce(ThisItem.RC.Prioridade.Value, "—")
              X: =980
              Y: =0
              Width: =120
              Height: =Parent.TemplateHeight
              Size: =10
              Color: =Switch(ThisItem.Situacao, "Atrasado", nfCorVermelho, "Vence em 7 dias", nfCorLaranja, "Em dia", nfCorVerde, "Entregue", nfCorAzul, nfCorSuave)
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
    - lblTotal_Carteira:
        Control: Label@2.5.1
        Properties:
          Text: =CountRows(galCarteira_Carteira.AllItems) & " de " & CountRows(colCarteira) & " itens (RC/PO vinculados e ativos)"
          X: =240
          Y: =Parent.Height - 40
          Width: =Parent.Width - 260
          Height: =28
          Size: =9
          Color: =nfCorSuave
          Font: =Font.'Segoe UI'
