    - galCarteira_Carteira:
        Control: Gallery@2.15.0
        Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
        Properties:
          Items: |-
            =Filter(
                colCarteira As c,
                IsBlank(txtBusca_Carteira.Text) || txtBusca_Carteira.Text in c.Numero_RC || txtBusca_Carteira.Text in c.Numero_PO
                    || txtBusca_Carteira.Text in c.ItemPO.Material || txtBusca_Carteira.Text in c.ItemPO.Descricao_Produto
                    || txtBusca_Carteira.Text in c.ItemPO.Nome_Fornecedor || txtBusca_Carteira.Text in c.RC.Responsavel_Diligencia.DisplayName,
                Switch(ddSituacao_Carteira.Selected.Value, "(Todos)", true, "(Em aberto)", c.Situacao <> "Entregue",
                    "Parcialmente atendido", c.Parcial, "Problema de NF", c.ProblemaNF <> "", c.Situacao = ddSituacao_Carteira.Selected.Value),
                ddFornecedor_Carteira.Selected.Value = "(Todos)" || c.ItemPO.Nome_Fornecedor = ddFornecedor_Carteira.Selected.Value,
                Switch(
                    ddEscopo_Carteira.Selected.Value,
                    "Todos os itens", true,
                    "Minha carteira (responsável pela RC)", Lower(c.RC.Responsavel_Diligencia.Email) = nfEmailUsuario,
                    CountRows(Filter(colAcoes, Numero_PO = c.Numero_PO && Item_PO = c.Item_PO && Lower(Responsavel_Pessoa.Email) = nfEmailUsuario)) > 0
                )
            )
          X: =240
          Y: =198
          Width: =Parent.Width - 260
          Height: =Parent.Height - 242
          TemplateSize: =52
          TemplatePadding: =0
          ShowScrollbar: =true
          OnSelect: =Set(gblItem, ThisItem); Navigate(scrDossie, ScreenTransition.None)
