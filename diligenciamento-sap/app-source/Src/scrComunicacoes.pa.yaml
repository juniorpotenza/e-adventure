          BorderColor: =nfCorLaranja
          BorderThickness: =1
    - avisoTxt_Comun:
        Control: Label
        Properties:
          Text: ="Consulta apenas. O envio de e-mails é feito exclusivamente pelo fluxo DIL_10 (comunicações COM-SLA-*), que impede reenvio do mesmo evento."
          X: =252
          Y: =120
          Width: =Parent.Width - 260 - 24
          Height: =40
          Size: =10
          Color: =nfCorLaranja
          Font: =Font.'Segoe UI'
    - txtBusca_Comun:
        Control: Classic/TextInput
        Properties:
          Default: =""
          HintText: ="Buscar assunto, PO ou RC"
          X: =240
          Y: =172
          Width: =300
          Height: =36
          Size: =10
          BorderColor: =nfCorLinha
    - ddEnvio_Comun:
        Control: Classic/DropDown
        Properties:
          Items: =["(Todas)", "Enviada pelo DIL_10", "Aguardando DIL_10", "Fora do escopo do DIL_10", "Inativa"]
          X: =552
          Y: =172
          Width: =240
          Height: =36
          Size: =10
          BorderColor: =nfCorLinha
    - galComun_Comun:
        Control: Gallery
        Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
        Properties:
          Items: |-
            =Sort(
                Filter(
                    AddColumns(
                        colComun As c,
                        StatusEnvio, If(
                        !IsBlank(LookUp(colEnvios, Chave_Entidade = c.Chave_Comunicacao)), "Enviada pelo DIL_10",
                        !c.Ativo, "Inativa",
                        StartsWith(c.Chave_Comunicacao, "COM-SLA-"), "Aguardando DIL_10",
                        "Fora do escopo do DIL_10"
                    ),
                        DataEnvio, LookUp(colEnvios, Chave_Entidade = c.Chave_Comunicacao, Data_Evento)
                    ),
                    IsBlank(txtBusca_Comun.Text) || txtBusca_Comun.Text in Assunto || txtBusca_Comun.Text in Numero_PO || txtBusca_Comun.Text in Numero_RC,
                    ddEnvio_Comun.Selected.Value = "(Todas)" || StatusEnvio = ddEnvio_Comun.Selected.Value
                ),
                Data_Comunicacao,
                SortOrder.Descending
            )
          X: =240
          Y: =224
          Width: =(Parent.Width - 260) * 0.55
          Height: =Parent.Height - 240
          TemplateSize: =58
          TemplatePadding: =0
          ShowScrollbar: =true
        Children:
        - cmFundo_Comun:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =Parent.TemplateHeight - 1
              Fill: =If(ThisItem.IsSelected, nfCorFundo, nfCorCartao)
              OnSelect: =Select(Parent)
        - cmAssunto_Comun:
            Control: Label
            Properties:
              Text: =Coalesce(ThisItem.Assunto, "(sem assunto)")
              X: =12
              Y: =4
              Width: =Parent.TemplateWidth - 24
              Height: =24
              Size: =10
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
        - cmInfo_Comun:
            Control: Label
            Properties:
              Text: =If(IsBlank(ThisItem.Data_Comunicacao), "—", Text(ThisItem.Data_Comunicacao, "dd/mm/yyyy hh:mm")) & " · " & Coalesce(ThisItem.Tipo_Comunicacao.Value, "—") & " · " & Coalesce(ThisItem.Sentido.Value, "—")
              X: =12
              Y: =28
              Width: =Parent.TemplateWidth - 200
              Height: =24
              Size: =9
              Color: =nfCorSuave
              Font: =Font.'Segoe UI'
        - cmStatus_Comun:
            Control: Label
            Properties:
              Text: =ThisItem.StatusEnvio
              X: =Parent.TemplateWidth - 190
              Y: =28
              Width: =180
              Height: =24
              Size: =9
              Color: =Switch(ThisItem.StatusEnvio, "Enviada pelo DIL_10", nfCorVerde, "Aguardando DIL_10", nfCorLaranja, nfCorSuave)
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
              Align: =Align.Right
    - detFundo_Comun:
