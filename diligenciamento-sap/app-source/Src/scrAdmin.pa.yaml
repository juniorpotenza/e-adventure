            Properties:
              Text: =ThisItem.Rotulo
              X: =16
              Y: =0
              Width: =Parent.TemplateWidth - 24
              Height: =Parent.TemplateHeight - 4
              Size: =11
              Color: =nfCorCartao
              Font: =Font.'Segoe UI'
              OnSelect: =Select(Parent)
              FontWeight: =If(ThisItem.Chave = "admin", FontWeight.Semibold, FontWeight.Normal)
