iscal", Corpo: "Prezado(a) {CONTATO}," & Char(10) & "" & Char(10) & "O material do item {ITEM_PO} do pedido {PO} ({MATERIAL} – {DESCRICAO}) foi recebido, mas a nota fiscal apresenta divergência que impede a entrada no sistema." & Char(10) & "" & Char(10) & "Solicitamos a correção (carta de correção ou nova NF) para regularizarmos o recebimento." & Char(10) & "" & Char(10) & "Atenciosamente," & Char(10) & "{DILIGENCIADOR}"}) As m, IsBlank(LookUp(Filter(colConfig, Lower(Trim(Categoria)) = "modelo_email"), Lower(Trim(Nome_Parametro)) = Lower(m.Nome)))) As p,
