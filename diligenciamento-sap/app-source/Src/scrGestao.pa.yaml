# Gerado por scripts/gerar_fontes.py — NÃO editar à mão; altere o gerador e rode de novo.
# Formato: Power Apps Source Code (*.pa.yaml), schema v3.0.
Screens:
  scrGestao:
    Properties:
      Fill: =nfCorFundo
      OnVisible: =If(!gblPodeGestao, Notify("Acesso restrito ao perfil de gestão.", NotificationType.Warning); Navigate(scrInicio, ScreenTransition.None))
    Children:
    - cabFundo_Gestao:
        Control: Rectangle
        Properties:
          X: =0
          Y: =0
          Width: =Parent.Width
          Height: =56
          Fill: =nfCorNavy
