# Gerado por scripts/gerar_fontes.py — NÃO editar à mão; altere o gerador e rode de novo.
# Formato: Power Apps Source Code (*.pa.yaml), schema v3.0.
Screens:
  scrGestao:
    Properties:
      Fill: =nfCorFundo
    Children:
    - cabFundo_Gestao:
        Control: Rectangle@2.3.0
        Properties:
          X: =0
          Y: =0
          Width: =Parent.Width
          Height: =56
          Fill: =nfCorNavy
    - cabMarca_Gestao:
