              Width: =Parent.TemplateWidth - 150
              Height: =24
              Size: =10
              Color: =nfCorTexto
              Font: =Font.'Segoe UI'
              FontWeight: =FontWeight.Semibold
        - aDesc_Acoes:
            Control: Label
            Properties:
              Text: =Coalesce(ThisItem.Descricao_Acao, "") & "  —  " & Coalesce(ThisItem.Responsavel_Pessoa.DisplayName, ThisItem.Responsavel, "sem responsável")
              X: =14
              Y: =28
              Width: =Parent.TemplateWidth - 150
              Height: =30
              Size: =9
              Color: =nfCorSuave
              Font: =Font.'Segoe UI'
        - aPrazo_Acoes:
            Control: Label
            Properties:
              Text: ="Prazo " & If(IsBlank(ThisItem.Prazo), "—", Text(ThisItem.Prazo, "dd/mm/yyyy"))
              X: =Parent.TemplateWidth - 140
              Y: =4
              Width: =130
              Height: =24
              Size: =10
