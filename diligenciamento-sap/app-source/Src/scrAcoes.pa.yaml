                        || (ddPrazo_Acoes.Selected.Value = "Vencem em 7 dias" && Prazo >= Now() && Prazo <= DateAdd(Now(), 7, TimeUnit.Days) && !(Status_Acao.Value in nfAcaoFechadas))
                ),
                Prazo
            )
          X: =240
          Y: =172
          Width: =(Parent.Width - 260) * 0.58
          Height: =Parent.Height - 188
          TemplateSize: =64
          TemplatePadding: =0
          ShowScrollbar: =true
        Children:
        - aFundo_Acoes:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =Parent.TemplateHeight - 1
              Fill: =If(ThisItem.IsSelected, nfCorFundo, nfCorCartao)
              OnSelect: =Select(Parent)
        - aFaixa_Acoes:
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =4
              Height: =Parent.TemplateHeight - 1
              Fill: =If(ThisItem.Prazo < Now() && !(ThisItem.Status_Acao.Value in nfAcaoFechadas), nfCorVermelho, nfCorAzul)
        - aTit_Acoes:
            Control: Label
            Properties:
              Text: =Coalesce(ThisItem.Tipo_Acao.Value, "—") & "  ·  PO " & ThisItem.Numero_PO & "/" & ThisItem.Item_PO
