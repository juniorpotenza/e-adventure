            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =Parent.TemplateHeight - 4
              Fill: =If(ThisItem.Chave = "acoes", nfCorNavy2, nfCorNavy)
              OnSelect: =Select(Parent)
        - mnuRotulo_Acoes:
            Control: Label
            Properties:
              Text: =ThisItem.Rotulo
              X: =16
              Y: =0
              Width: =Parent.TemplateWidth - 24
              Height: =Parent.TemplateHeight - 4
              Size: =11
              Color: =nfCorCartao
              Font: =Font.'Segoe UI'
              OnSelect: =Select(Parent)
              FontWeight: =If(ThisItem.Chave = "acoes", FontWeight.Semibold, FontWeight.Normal)
    - menuRodape_Acoes:
        Control: Label
        Properties:
          Text: ="Atualizado " & If(IsBlank(gblCarregadoEm), "—", Text(gblCarregadoEm, "dd/mm hh:mm"))
